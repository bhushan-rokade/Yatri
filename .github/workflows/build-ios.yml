name: Build iOS App (Unsigned)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install
          npx pod-install ios

      - name: Disable Code Signing for CI
        run: |
          cd ios
          sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/' yatrinew.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/' yatrinew.xcodeproj/project.pbxproj

      - name: Build iOS App (Unsigned)
        run: |
          cd ios
          xcodebuild \
            -workspace yatrinew.xcworkspace \
            -scheme yatrinew \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: ios/build/Build/Products/Release-iphoneos/*.app

      - name: Create GitHub Release and Upload iOS App
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "iOS Build ${{ github.run_number }}"
          body: "Unsigned iOS build from CI pipeline"
          files: ios/build/Build/Products/Release-iphoneos/*.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
