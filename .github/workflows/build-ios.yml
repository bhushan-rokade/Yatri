name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write   # required for creating releases

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install
          npx pod-install ios

      - name: Disable Code Signing for CI
        run: |
          cd ios
          sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/' yatrinew.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/' yatrinew.xcodeproj/project.pbxproj

      - name: Build iOS Archive (Unsigned)
        run: |
          cd ios
          xcodebuild \
            -workspace yatrinew.xcworkspace \
            -scheme yatrinew \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -archivePath build/yatrinew.xcarchive \
            clean archive

      - name: Export Unsigned IPA
        run: |
          cd ios
          mkdir -p build/export
          cat <<EOF > build/export/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string></string>
            <key>provisioningProfiles</key><dict/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/yatrinew.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/export/ExportOptions.plist \
            CODE_SIGNING_ALLOWED=NO

          # Rename IPA to include run number
          mv build/export/yatrinew.ipa build/export/yatrinew-v${GITHUB_RUN_NUMBER}.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/export/yatrinew-v${{ github.run_number }}.ipa

      - name: Create GitHub Release and Upload IPA
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "iOS Build ${{ github.run_number }}"
          body: "Unsigned iOS IPA from CI pipeline"
          files: ios/build/export/yatrinew-v${{ github.run_number }}.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
